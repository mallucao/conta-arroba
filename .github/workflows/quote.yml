name: Cotação e site

# A fonte responde HTTP 403 aos servidores do GitHub, por isso a busca agendada roda no computador
# do dono do projeto (scripts/atualizar-cotacao.cmd) e envia dist/quote.json. Aqui a busca é só uma
# tentativa extra: se falhar, o arquivo enviado é mantido e o site é publicado do mesmo jeito.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cotacao-e-site
  cancel-in-progress: false

jobs:
  cotacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test
      - name: Buscar o último fechamento publicado
        id: quote
        run: node server/update-quote.mjs
      - name: Gravar a cotação no repositório
        if: steps.quote.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.quote.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/quote.json
          git commit -m "Cotação: $SUMMARY"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: cotacao
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
